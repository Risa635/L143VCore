<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enna Pakuriga 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.3) 0 3px, transparent 4px),
    linear-gradient(135deg, #ff4f91, #ff6b9f, #8e44ff);
  background-size: 90px 90px, 130px 130px, cover;
}

.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart {
  position: absolute;
  font-size: 50px;
  opacity: .75;
  animation: float 7s ease-in-out infinite;
}

.heart:nth-child(1) {
  left: 8%;
  top: 12%;
}

.heart:nth-child(2) {
  right: 10%;
  top: 18%;
  animation-delay: 1.5s;
}

.heart:nth-child(3) {
  left: 15%;
  bottom: 15%;
  animation-delay: 3s;
}

.heart:nth-child(4) {
  right: 17%;
  bottom: 12%;
  animation-delay: 4.5s;
}

.heart:nth-child(5) {
  left: 48%;
  top: 8%;
  animation-delay: 2s;
}

.card {
  width: 90%;
  max-width: 900px;
  padding: 80px 30px;
  text-align: center;
  border-radius: 36px;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.5);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 30px 80px rgba(70,0,70,.3);
}

.small {
  color: rgba(255,255,255,.9);
  font-size: 20px;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

h1 {
  color: white;
  font-size: clamp(55px, 11vw, 125px);
  font-weight: 900;
  line-height: .95;
  letter-spacing: -5px;
  text-shadow: 0 8px 30px rgba(80,0,60,.3);
}

.sub {
  margin-top: 30px;
  color: white;
  font-size: 25px;
}

.pulse {
  display: inline-block;
  margin-top: 30px;
  font-size: 35px;
  animation: pulse 1.5s infinite;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(-8deg);
  }

  50% {
    transform: translateY(-25px) rotate(8deg);
  }
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.3);
  }
}
</style>
</head>

<body>

<div class="hearts">
  <div class="heart">💗</div>
  <div class="heart">💕</div>
  <div class="heart">💖</div>
  <div class="heart">💞</div>
  <div class="heart">❤️</div>
</div>

<div class="card">
  <div class="small">Just a little question...</div>

  <h1>Enna Pakuriga</h1>

  <div class="sub">👀💗</div>

  <div class="pulse">♥</div>
</div>

</body>
</html>
